name: CI

# ------------------------------------------------------------
# Activadores:
#   - push               |  SOLO main
#   - pull_request       |  Comprueba propuestas de cambio
#   - workflow_dispatch  |  Ejecución manual
# ------------------------------------------------------------
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. REVISIÓN DE CÓDIGO Y FORMATO (Ruff)
  revision:
    name: Revisión de código (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.0

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format --check
        run: python -m ruff format --check .

  # 2. PRUEBAS UNITARIAS
  unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias
        run: python -m pytest pruebas/test_calculadora.py pruebas/test_reporte.py pruebas/test_guia.py -v

  # 3. PRUEBAS DE INTEGRACIÓN (menú + API)
  #    Espera a: unitarias
  integracion:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: [unitarias]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas de integración
        run: python -m pytest pruebas/test_integracion.py -v

  # 4. COBERTURA
  #    Espera a: unitarias, integracion
  #    Genera coverage.xml que consumirá SonarQube.
  cobertura:
    name: Cobertura
    runs-on: ubuntu-latest
    needs: [unitarias, integracion]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ejecutar pruebas con cobertura
        run: |
          python -m pytest \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=reports/junit.xml

      - name: Publicar coverage.xml como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: |
            coverage.xml
            reports/junit.xml
          if-no-files-found: error

  # 5. SECRETOS (Gitleaks)
  secretos:
    name: Búsqueda de secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 6. SEGURIDAD (Bandit)
  seguridad:
    name: Seguridad (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit==1.9.4

      - name: Ejecutar Bandit
        run: bandit -r calculadora.py api.py herramientas

  # 7. DEPENDENCIAS VULNERABLES (pip-audit)
  dependencias:
    name: Dependencias vulnerables (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit==2.10.1

      - name: Auditar dependencias
        run: pip-audit -r requirements.txt

  # 8. DEPENDENCIAS OBSOLETAS (informativo)
  obsoletas:
    name: Dependencias obsoletas (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Listar dependencias obsoletas
        run: python -m pip list --outdated

  # 9. OWASP ZAP contra la API en marcha
  #    Espera a: integracion, secretos, seguridad, dependencias

  zap:
    name: OWASP ZAP
    runs-on: ubuntu-latest
    needs: [integracion, secretos, seguridad, dependencias]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Levantar la API
        run: |
          nohup python -m uvicorn api:aplicacion --host 0.0.0.0 --port 8000 \
            > /tmp/api.log 2>&1 &
          echo $! > /tmp/api.pid
          disown || true
          for intento in {1..30}; do
            if curl -fsS http://localhost:8000/estado; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8000/estado"
          allow_issue_writing: false
          fail_action: true
          rules_file_name: .zap/reglas.tsv
          artifact_name: zap-report

  # 10. BUILD AND ANALYZE (SonarQube)
  #     Espera a: cobertura, revision, secretos, seguridad, dependencias
  #     Solo en main
  build-and-analyze:
    name: Build and analyze
    runs-on: ubuntu-latest
    needs: [cobertura, revision, secretos, seguridad, dependencias]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Shallow clones desactivados para mejor relevancia del análisis

      - name: Descargar coverage.xml
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.lynvera.ai

      - name: Publicar identificador del análisis
        uses: actions/upload-artifact@v4
        with:
          name: sonar-task
          path: .scannerwork/report-task.txt
          include-hidden-files: true
          if-no-files-found: error

  # 11. REPORTE (PDF + JSON + MD) Y QUALITY GATE
  #     Espera a: build-and-analyze
  #     Solo en main.
  reporte:
    name: Reporte SonarQube
    runs-on: ubuntu-latest
    needs: [build-and-analyze]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Descargar identificador del análisis
        uses: actions/download-artifact@v4
        with:
          name: sonar-task
          path: .scannerwork

      - name: Generar reportes (PDF, JSON, MD)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python -m herramientas.reporte_sonarqube

      - name: Publicar artefacto sonarqube-report-pdf-json-md
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report-pdf-json-md
          path: reports/sonarqube/
          if-no-files-found: error

  # 12. RESUMEN
  #     Espera a TODOS. Se ejecuta siempre (if: always()).
  resumen:
    name: Resumen
    runs-on: ubuntu-latest
    needs:
      - revision
      - unitarias
      - integracion
      - cobertura
      - secretos
      - seguridad
      - dependencias
      - obsoletas
      - zap
      - build-and-analyze
      - reporte
    if: always()
    steps:
      - name: Estado de todos los controles
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          fallos = []
          for nombre, datos in json.loads(os.environ["RESULTADOS"]).items():
              estado = datos["result"]
              print(f"{nombre}: {estado}")
              if nombre == "obsoletas":
                  continue
              if nombre in ("build-and-analyze", "reporte") and estado == "skipped":
                  if os.environ["GITHUB_REF"] != "refs/heads/main":
                      continue
              if estado != "success":
                  fallos.append(nombre)
          if fallos:
              print("Controles pendientes: " + ", ".join(fallos))
              sys.exit(1)
          PY
